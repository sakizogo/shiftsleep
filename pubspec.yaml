name: shiftsleep
description: "交代勤務者向け睡眠管理アプリ。分割睡眠・シフト対応・医学的信頼性を重視。"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.1.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.2
  provider: ^6.1.5+1
  sqflite: ^2.3.0
  path: ^1.8.3
  table_calendar: ^3.2.0
  flutter_local_notifications: ^18.0.0
  timezone: ^0.9.2
  uuid: ^4.0.0
  audioplayers: ^6.8.1
  permission_handler: ^13.0.1
  purchases_flutter: ^9.0.0
  shared_preferences: ^2.5.5
  flutter_riverpod: ^2.4.0
  intl: 0.20.3
dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^2.0.0

flutter:
  uses-material-design: true
  
  assets:
    - assets/raw/